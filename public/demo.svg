<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <clipPath id="round"><rect width="800" height="520" rx="12"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f9fb"/><stop offset="1" stop-color="#eef1f6"/></linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity=".08"/></filter>
  </defs>

  <!-- Window -->
  <rect width="800" height="520" rx="12" fill="url(#bg)" clip-path="url(#round)"/>
  <rect width="800" height="520" rx="12" stroke="#d1d5db" stroke-width="1" fill="none"/>

  <!-- Title Bar -->
  <rect width="800" height="48" rx="12" fill="#fff"/>
  <rect y="40" width="800" height="8" fill="#fff"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="24" r="6" fill="#febc2e"/>
  <circle cx="60" cy="24" r="6" fill="#28c840"/>
  <text x="400" y="29" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1f2937">Epic Vendor Services  Support Copilot</text>

  <!-- Header -->
  <rect y="48" width="800" height="52" fill="#fff"/>
  <line x1="0" y1="100" x2="800" y2="100" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="36" cy="74" r="14" fill="#5b4cd4"/>
  <text x="36" y="79" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#fff">E</text>
  <text x="58" y="70" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">Epic Vendor Services</text>
  <text x="58" y="85" font-family="system-ui" font-size="11" fill="#6b7280">Support Copilot</text>

  <!-- Chat / Chat Tab indicator -->
  <rect x="660" y="58" width="52" height="28" rx="6" fill="#5b4cd4"/>
  <text x="686" y="76" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#fff">Chat</text>
  <rect x="718" y="58" width="52" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="744" y="76" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="500" fill="#6b7280">Docs</text>

  <!-- Messages area -->
  <!-- User message 1 -->
  <rect x="300" y="116" width="476" height="40" rx="16" fill="#5b4cd4" filter="url(#shadow)"/>
  <text x="316" y="140" font-family="system-ui" font-size="13" fill="#fff">How do I reset my password for Epic Vendor Services?</text>

  <!-- Bot response 1 -->
  <rect x="24" y="170" width="540" height="100" rx="16" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="40" y="192" font-family="system-ui" font-size="13" fill="#374151">To reset your password, please contact your</text>
  <text x="40" y="210" font-family="system-ui" font-size="13" fill="#374151"><tspan font-weight="600">organization administrator</tspan>. They can reset it through</text>
  <text x="40" y="228" font-family="system-ui" font-size="13" fill="#374151">the Epic Admin Portal. For more details, see:</text>
  <text x="40" y="254" font-family="system-ui" font-size="12" fill="#5b4cd4">=Ä Password Reset  Authentication</text>

  <!-- Memory badge -->
  <rect x="24" y="282" width="130" height="22" rx="11" fill="#ede9fe"/>
  <text x="39" y="297" font-family="system-ui" font-size="10" fill="#5b4cd4">>à memory used</text>

  <!-- User message 2 -->
  <rect x="440" y="316" width="336" height="40" rx="16" fill="#5b4cd4" filter="url(#shadow)"/>
  <text x="456" y="340" font-family="system-ui" font-size="13" fill="#fff">I work at a hospital in the billing department</text>

  <!-- Bot response 2 -->
  <rect x="24" y="370" width="500" height="64" rx="16" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="40" y="392" font-family="system-ui" font-size="13" fill="#374151">Got it! I'll keep that in mind for future questions.</text>
  <text x="40" y="410" font-family="system-ui" font-size="13" fill="#374151">How can I help you with billing today?</text>
  <rect x="24" y="444" width="196" height="22" rx="11" fill="#dcfce7"/>
  <text x="39" y="459" font-family="system-ui" font-size="10" fill="#166534"> New memory saved</text>

  <!-- Input area -->
  <rect y="474" width="800" height="46" fill="#fff"/>
  <line x1="0" y1="474" x2="800" y2="474" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="50" y="482" width="700" height="32" rx="16" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="70" y="503" font-family="system-ui" font-size="12" fill="#9ca3af">Ask about Epic Vendor Services...</text>

  <!-- Memory icon (left of input) -->
  <rect x="16" y="486" width="24" height="24" rx="4" fill="none" stroke="#5b4cd4" stroke-width="1.5"/>
  <line x1="21" y1="492" x2="35" y2="492" stroke="#5b4cd4" stroke-width="1"/>
  <line x1="21" y1="496" x2="35" y2="496" stroke="#5b4cd4" stroke-width="1"/>
  <line x1="21" y1="500" x2="30" y2="500" stroke="#5b4cd4" stroke-width="1"/>
  <circle cx="38" cy="488" r="7" fill="#5b4cd4"/>
  <text x="38" y="492" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">1</text>

  <!-- Send icon -->
  <circle cx="764" cy="498" r="12" fill="#5b4cd4"/>
  <polygon points="758,498 770,498 764,490" fill="#fff"/>
</svg>
